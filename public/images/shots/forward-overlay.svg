<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 875" width="1400" height="875" role="img" aria-label="Forward overlay running over a shared screen: stealth top bar, live transcript and AI answer panel">
<!-- UI mockup of Forward (C# WPF). Layout, palette and controls follow the real
     TopBarWindow.xaml / ResponsePanel.xaml. Not a capture of the running app. -->
<defs>
  <linearGradient id="fw-mark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#CACACA"/><stop offset=".4" stop-color="#929292"/>
    <stop offset=".72" stop-color="#757575"/><stop offset="1" stop-color="#666"/>
  </linearGradient>
  <linearGradient id="fw-slide" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b2330"/><stop offset="1" stop-color="#121820"/>
  </linearGradient>
  <filter id="fw-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
  </filter>
  <style>
    .m { font-family: Consolas, 'Cascadia Mono', ui-monospace, monospace; }
    .s { font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>
</defs>

<!-- ── shared screen behind the overlay ──────────────────────────────── -->
<rect width="1400" height="875" fill="#0b0e13"/>
<rect x="0" y="0" width="1400" height="875" fill="url(#fw-slide)"/>
<g opacity=".38">
  <text class="s" x="96" y="250" fill="#dfe6f2" font-size="54" font-weight="600">Garbage Collection in the JVM</text>
  <rect x="96" y="286" width="150" height="4" rx="2" fill="#5b8def"/>
  <g fill="#9fb0c8" font-size="24" class="s">
    <text x="96" y="356">• Young generation — Eden, S0, S1</text>
    <text x="96" y="400">• Minor GC vs. major GC pauses</text>
    <text x="96" y="444">• G1 regions and the remembered set</text>
    <text x="96" y="488">• Tuning: -Xmx, -XX:MaxGCPauseMillis</text>
  </g>
  <rect x="860" y="320" width="440" height="250" rx="10" fill="#0d1219" stroke="#243043"/>
  <g class="m" font-size="16" fill="#7d8ea6">
    <text x="884" y="356">$ java -XX:+PrintGCDetails App</text>
    <text x="884" y="384" fill="#6fae7a">[GC pause (G1 Evacuation) 48M-&gt;12M]</text>
    <text x="884" y="412" fill="#6fae7a">[GC pause (G1 Evacuation) 51M-&gt;13M]</text>
    <text x="884" y="440">  eden 32M  survivors 4M  old 9M</text>
  </g>
  <rect x="520" y="806" width="360" height="44" rx="22" fill="#171d27" stroke="#2a3443"/>
  <g fill="#7d8ea6"><circle cx="560" cy="828" r="8"/><circle cx="600" cy="828" r="8"/><circle cx="640" cy="828" r="8"/></g>
  <text class="s" x="680" y="834" fill="#7d8ea6" font-size="15">Screen sharing · 38 participants</text>
</g>

<!-- ── stealth top bar (TopBarWindow.xaml) ──────────────────────────── -->
<g filter="url(#fw-shadow)">
  <rect x="24" y="20" width="612" height="44" rx="12" fill="#0E0E12" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".18"/>
</g>
<g transform="translate(36,30) scale(0.2)">
  <polyline points="24,34 42,90 60,54 78,90 96,34" fill="none" stroke="url(#fw-mark)" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M97,12 L100.5,25 L114,29 L100.5,33 L97,46 L93.5,33 L80,29 L93.5,25 Z" fill="url(#fw-mark)"/>
</g>
<rect x="64" y="32" width="58" height="20" rx="10" fill="#4E4E4E" fill-opacity=".3"/>
<circle cx="76" cy="42" r="3.5" fill="#8fd49b"/>
<text class="m" x="86" y="46" fill="#BDBDBD" font-size="11">Live</text>
<rect x="130" y="27" width="34" height="30" rx="8" fill="#616161" fill-opacity=".33"/>
<g font-size="15" text-anchor="middle">
  <text x="147" y="47">🎙</text><text x="183" y="47" opacity=".82">💬</text>
  <text x="219" y="47" opacity=".82">🖥</text><text x="255" y="47" opacity=".82">🧑‍💻</text>
</g>
<rect x="279" y="32" width="1" height="20" fill="#fff" fill-opacity=".13"/>
<rect x="291" y="31" width="40" height="22" rx="11" fill="#9F9F9F" fill-opacity=".34"/>
<circle cx="320" cy="42" r="8" fill="#fff"/>
<text class="m" x="338" y="46" fill="#D4D4D4" font-size="10">Listening</text>
<rect x="404" y="32" width="1" height="20" fill="#fff" fill-opacity=".13"/>
<text class="m" x="416" y="46" fill="#D4D4D4" font-size="10">🕶 Stealth</text>
<rect x="500" y="32" width="1" height="20" fill="#fff" fill-opacity=".13"/>
<g font-size="14" text-anchor="middle" fill="#E6E6E6" opacity=".85">
  <text x="524" y="47">⚡</text><text x="560" y="47">⚙</text><text x="600" y="47">✕</text>
</g>

<!-- stealth callout -->
<g opacity=".9">
  <rect x="656" y="26" width="282" height="32" rx="16" fill="#0E0E12" fill-opacity=".82" stroke="#3a7d4f"/>
  <circle cx="676" cy="42" r="4" fill="#6fae7a"/>
  <text class="m" x="690" y="47" fill="#8fd49b" font-size="12">WDA_EXCLUDEFROMCAPTURE · hidden</text>
</g>

<!-- ── response panel (ResponsePanel.xaml) ──────────────────────────── -->
<g filter="url(#fw-shadow)">
  <rect x="420" y="112" width="944" height="716" rx="12" fill="#0A0A0A" fill-opacity=".92" stroke="#ffffff" stroke-opacity=".12"/>
</g>
<path d="M420 124a12 12 0 0 1 12-12h920a12 12 0 0 1 12 12v28H420z" fill="#1C1F26"/>
<text class="m" x="444" y="138" fill="#E8E8EC" font-size="12" letter-spacing="2">FORWARD</text>
<g fill="#FFFFFF" fill-opacity=".22"><circle cx="880" cy="133" r="2"/><circle cx="890" cy="133" r="2"/><circle cx="900" cy="133" r="2"/></g>
<text class="m" x="1340" y="138" fill="#A6A6A6" font-size="11" text-anchor="end">Claude · opus  ⟡  NPU</text>
<rect x="420" y="152" width="944" height="1" fill="#fff" fill-opacity=".09"/>

<!-- transcript column -->
<text class="m" x="444" y="186" fill="#77CDCDCD" font-size="11" letter-spacing="1.6">LIVE CONVERSATION</text>
<rect x="444" y="204" width="330" height="1" fill="#fff" fill-opacity=".07"/>

<g class="m" font-size="11" fill="#55FFFFFF">
  <text x="444" y="232">Them · 00:41</text>
</g>
<path d="M444 242h300a8 8 0 0 1 8 8v36a8 8 0 0 1-8 8h-298a2 2 0 0 1-2-2z" fill="#FFFFFF" fill-opacity=".09"/>
<text class="s" x="458" y="266" fill="#DDFFFFFF" font-size="14">why does a minor GC still pause</text>
<text class="s" x="458" y="284" fill="#DDFFFFFF" font-size="14">every thread?</text>
<g opacity=".5"><rect x="444" y="300" width="2" height="8" y2="0" fill="#8fd49b"/><rect x="449" y="296" width="2" height="16" fill="#8fd49b"/><rect x="454" y="299" width="2" height="10" fill="#8fd49b"/><rect x="459" y="294" width="2" height="20" fill="#8fd49b"/><rect x="464" y="300" width="2" height="8" fill="#8fd49b"/></g>

<g class="m" font-size="11" fill="#55FFFFFF"><text x="444" y="348">You · 00:52</text></g>
<path d="M452 358h298a2 2 0 0 1 2 2v40a2 2 0 0 1-2 2h-290a8 8 0 0 1-8-8v-28a8 8 0 0 1 8-8z" fill="#FFFFFF" fill-opacity=".055"/>
<text class="s" x="466" y="382" fill="#99FFFFFF" font-size="14">Good question — let me pull up</text>
<text class="s" x="466" y="400" fill="#99FFFFFF" font-size="14">the safepoint diagram.</text>

<g class="m" font-size="11" fill="#55FFFFFF"><text x="444" y="448">Them · 01:07</text></g>
<path d="M444 458h300a8 8 0 0 1 8 8v36a8 8 0 0 1-8 8h-298a2 2 0 0 1-2-2z" fill="#FFFFFF" fill-opacity=".09"/>
<text class="s" x="458" y="482" fill="#DDFFFFFF" font-size="14">and is G1 always better than</text>
<text class="s" x="458" y="500" fill="#DDFFFFFF" font-size="14">parallel GC?</text>

<rect x="444" y="548" width="330" height="26" rx="5" fill="#FFFFFF" fill-opacity=".04"/>
<text class="m" x="456" y="566" fill="#44FFFFFF" font-size="11">listening · loopback + mic</text>

<rect x="798" y="176" width="1" height="580" fill="#fff" fill-opacity=".07"/>

<!-- answer column -->
<g class="m" font-size="11">
  <text x="822" y="186" fill="#77CDCDCD" letter-spacing="1.6">ANSWER</text>
  <text x="1340" y="186" fill="#55BCBCBC" text-anchor="end">3 questions  ‹ 3/3 ›</text>
</g>
<rect x="822" y="204" width="518" height="1" fill="#fff" fill-opacity=".07"/>

<rect x="822" y="222" width="518" height="54" rx="6" fill="#FFFFFF" fill-opacity=".055"/>
<text class="m" x="836" y="244" fill="#66FFFFFF" font-size="11">QUESTION</text>
<text class="s" x="836" y="266" fill="#EEFFFFFF" font-size="15">Is G1 always better than parallel GC?</text>

<g class="s" font-size="15" fill="#E8E8EC">
  <text x="822" y="314">No — G1 trades throughput for predictable pause</text>
  <text x="822" y="340">times. It wins when you need a pause target under</text>
  <text x="822" y="366">~200 ms on a multi-GB heap.</text>
</g>
<g class="s" font-size="15" fill="#CDCDCD">
  <text x="822" y="410">★  Parallel GC still gives higher raw throughput on</text>
  <text x="844" y="434">small heaps or batch jobs where pauses don't matter.</text>
  <text x="822" y="468">★  G1 splits the heap into equal regions and collects</text>
  <text x="844" y="492">the ones with the most garbage first — hence</text>
  <text x="844" y="516">"garbage first".</text>
  <text x="822" y="550">★  Rule of thumb: heap &gt; 4 GB and latency-sensitive</text>
  <text x="844" y="574">→ G1. Otherwise measure before switching.</text>
</g>
<rect x="822" y="596" width="7" height="16" fill="#8fd49b" opacity=".8"/>

<g>
  <rect x="822" y="638" width="104" height="24" rx="5" fill="#FFFFFF" fill-opacity=".08"/>
  <text class="m" x="836" y="655" fill="#88E9E9E9" font-size="11">⟡ Claude</text>
  <rect x="936" y="638" width="150" height="24" rx="5" fill="#FFFFFF" fill-opacity=".055"/>
  <text class="m" x="950" y="655" fill="#77CDCDCD" font-size="11">slide 14 · gc-notes.md</text>
  <rect x="1096" y="638" width="98" height="24" rx="5" fill="#FFFFFF" fill-opacity=".055"/>
  <text class="m" x="1110" y="655" fill="#77CDCDCD" font-size="11">1.4s · NPU</text>
</g>

<rect x="822" y="700" width="518" height="44" rx="8" fill="#FFFFFF" fill-opacity=".06" stroke="#fff" stroke-opacity=".08"/>
<text class="m" x="838" y="728" fill="#4DFFFFFF" font-size="13">Ask a follow-up…</text>
<text class="m" x="1326" y="728" fill="#66FFFFFF" font-size="13" text-anchor="end">⏎</text>

<g class="m" font-size="11" fill="#44FFFFFF">
  <text x="444" y="800">Alt+Space toggle</text>
  <text x="600" y="800">Ctrl+Space explain last 30s</text>
  <text x="840" y="800">Alt+A focus input</text>
  <text x="1340" y="800" text-anchor="end">Whisper ONNX · XDNA NPU · VAD on CPU</text>
</g>
</svg>
