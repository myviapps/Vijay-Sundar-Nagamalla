<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 875" width="1400" height="875" role="img" aria-label="Forward settings: AI provider failover chain, devices, transparency and profile">
<!-- UI mockup of Forward's SettingsWindow. Section names, field labels and
     palette follow the real SettingsWindow.xaml. Not a capture. -->
<defs>
  <linearGradient id="fs-mark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#CACACA"/><stop offset=".4" stop-color="#929292"/>
    <stop offset=".72" stop-color="#757575"/><stop offset="1" stop-color="#666"/>
  </linearGradient>
  <style>
    .m { font-family: Consolas, 'Cascadia Mono', ui-monospace, monospace; }
    .s { font-family: 'Segoe UI', system-ui, sans-serif; }
    .lbl { font-size: 11px; letter-spacing: 1.6px; }
  </style>
</defs>

<rect width="1400" height="875" fill="#151518"/>
<rect x="40" y="36" width="1320" height="804" rx="12" fill="#212121" stroke="#ffffff" stroke-opacity=".1"/>

<!-- title bar -->
<path d="M40 48a12 12 0 0 1 12-12h1296a12 12 0 0 1 12 12v34H40z" fill="#1C1F26"/>
<g transform="translate(60,46) scale(0.17)">
  <polyline points="24,34 42,90 60,54 78,90 96,34" fill="none" stroke="url(#fs-mark)" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M97,12 L100.5,25 L114,29 L100.5,33 L97,46 L93.5,33 L80,29 L93.5,25 Z" fill="url(#fs-mark)"/>
</g>
