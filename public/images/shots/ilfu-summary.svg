<g class="m" fill="#d6dde7">
  <text x="64" y="192">Two engineers worked through the refresh pipeline for the multi-platform</text>
  <text x="64" y="218">sync. They agreed each platform adapter must be idempotent so a retry</text>
  <text x="64" y="244">cannot double-count submissions, and settled on a per-platform lease</text>
  <text x="64" y="270">rather than per-classroom, so one slow provider cannot stall the others.</text>
